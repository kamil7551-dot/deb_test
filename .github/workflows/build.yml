name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml pytest pyflakes
      - name: Lint
        run: python -m pyflakes app/tester app/tests
      - name: Unit tests
        run: cd app && python -m pytest -q tests
      - name: Headless smoke run (no hardware)
        run: |
          cd app
          TESTER_DATA_DIR=$RUNNER_TEMP/td TESTER_PROFILES=../profiles TESTER_STATE_FILE=$RUNNER_TEMP/td/state.yaml \
            python -m tester --headless --profile quick --serial CI-TEST-0001 --out $RUNNER_TEMP/report.json
          python -c "import json,sys; r=json.load(open('$RUNNER_TEMP/report.json')); assert r['serial']=='CI-TEST-0001' and r['run_id']"

  iso:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install live-build
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools mtools dosfstools isolinux syslinux-common \
            syslinux-utils grub-efi-amd64-bin grub-pc-bin cpio ca-certificates python3
      - name: Build ISO
        run: tools/build-iso.sh
      - name: Upload ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itad-tester-iso
          path: |
            out/*.iso
            out/*.sha256
          retention-days: 14
          if-no-files-found: warn
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-build-log
          path: live-build/build.log
          retention-days: 7
          if-no-files-found: ignore

  boot-test:
    needs: iso
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [bios, uefi, secureboot]
        media: [cdrom]
        include:                       # tester on a dd-ed USB stick (Rufus DD / Etcher)
          - {mode: bios, media: usb}
          - {mode: secureboot, media: usb}
          - {mode: uefi, media: usb-raw}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: itad-tester-iso
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU and OCR
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf tesseract-ocr tesseract-ocr-pol imagemagick mtools dosfstools fdisk socat python3-yaml
      - name: Boot test (${{ matrix.mode }}, ${{ matrix.media }})
        run: MEDIA=${{ matrix.media }} tools/qemu-boot-test.sh out/*.iso ${{ matrix.mode }} out/boot-${{ matrix.mode }}-${{ matrix.media }}
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ matrix.mode }}-${{ matrix.media }}
          path: out/boot-${{ matrix.mode }}-${{ matrix.media }}
          retention-days: 7

  release:
    # Every push to main whose app version (app/tester/__init__.py) has no release yet publishes
    # GitHub Release vX.Y.Z with the ISO: a stable download link that does not expire.
    # To ship a new version: bump __version__ in a PR and merge it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: boot-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: itad-tester-iso
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/tester/__init__.py)
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump __version__ to publish a new one."
            exit 0
          fi
          cat > notes.md <<NOTES
          Bootable ITAD tester image (Debian 13, UEFI + Secure Boot + legacy BIOS), commit ${GITHUB_SHA::7}.
          Boot-tested in QEMU on BIOS, UEFI and Secure Boot before publishing.

          Write it to a USB stick: see INSTRUCTIONS.md, section "USB stick".
          Check the download: \`sha256sum -c *.sha256\`
          NOTES
          gh release create "$TAG" out/*.iso out/*.sha256 --target "$GITHUB_SHA" \
            --title "ITAD tester $TAG" --notes-file notes.md
